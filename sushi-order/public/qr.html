<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QRコード印刷 | 寿司 博多魚がし</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Noto+Serif+JP:wght@700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Noto Sans JP", system-ui, sans-serif; background: #f4f1ea; color: #1b2a41; }
    .controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; padding: 16px 20px; background: #1b2a41; color: #fff; }
    .controls label { display: grid; gap: 4px; font-size: 12px; }
    .controls input { font: inherit; font-size: 15px; padding: 8px 10px; border-radius: 8px; border: 0; }
    #base { width: 320px; max-width: 100%; }
    #count { width: 90px; }
    .controls button { font: inherit; font-weight: 700; padding: 9px 18px; border: 0; border-radius: 999px; background: #c8372d; color: #fff; cursor: pointer; }
    .hint { padding: 10px 20px; font-size: 13px; color: #6b7280; }
    .sheet { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; padding: 8px 20px 40px; }
    .tag { background: #fff; border: 2px solid #1b2a41; border-radius: 12px; padding: 14px; text-align: center; break-inside: avoid; }
    .tag .shop { font-family: "Noto Serif JP", serif; font-weight: 700; font-size: 16px; letter-spacing: .06em; }
    .tag .qr { display: flex; justify-content: center; margin: 10px 0; }
    .tag .num { font-size: 22px; font-weight: 700; color: #c8372d; }
    .tag .langs { font-size: 11px; color: #6b7280; margin-top: 4px; }
    @media print {
      .controls, .hint { display: none; }
      body { background: #fff; }
      .sheet { grid-template-columns: repeat(2, 1fr); padding: 0; gap: 12px; }
    }
  </style>
</head>
<body>
  <div class="controls">
    <label>サイトのURL (Base URL)
      <input id="base" type="url" placeholder="https://your-domain.example">
    </label>
    <label>テーブル数
      <input id="count" type="number" min="1" max="99" value="24">
    </label>
    <button id="btn-gen" type="button">作成</button>
    <button id="btn-print" type="button">印刷</button>
  </div>
  <p class="hint">Nhập địa chỉ website thật của quán (ví dụ https://order.ten-mien.jp), bấm 作成 rồi 印刷. Mỗi QR dẫn tới <code>/?table=số-bàn</code>.</p>
  <div class="sheet" id="sheet"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    (function () {
      var base = document.getElementById("base");
      base.value = location.origin;

      function generate() {
        var root = base.value.replace(/\/+$/, "");
        var n = Math.max(1, Math.min(99, parseInt(document.getElementById("count").value, 10) || 1));
        var sheet = document.getElementById("sheet");
        sheet.textContent = "";
        for (var i = 1; i <= n; i++) {
          var tag = document.createElement("div");
          tag.className = "tag";

          var shop = document.createElement("div");
          shop.className = "shop";
          shop.textContent = "寿司 博多魚がし";

          var qr = document.createElement("div");
          qr.className = "qr";
          new QRCode(qr, { text: root + "/?table=" + i, width: 160, height: 160, correctLevel: QRCode.CorrectLevel.M });

          var num = document.createElement("div");
          num.className = "num";
          num.textContent = "TABLE " + i;

          var langs = document.createElement("div");
          langs.className = "langs";
          langs.textContent = "日本語 / English / 简体中文 / 繁體中文 / 한국어";

          tag.append(shop, qr, num, langs);
          sheet.appendChild(tag);
        }
      }

      document.getElementById("btn-gen").addEventListener("click", generate);
      document.getElementById("btn-print").addEventListener("click", function () { window.print(); });
      window.addEventListener("load", generate);
    })();
  </script>
</body>
</html>
