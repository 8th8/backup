<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>注文管理 | 寿司 博多魚がし</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root { --ink:#1b2a41; --paper:#f4f1ea; --card:#fff; --line:#e3ddd0; --red:#c8372d; --amber:#d9822b; --green:#3f8f5c; --grey:#8a8f99; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin:0; font-family:"Noto Sans JP",system-ui,sans-serif; background:var(--paper); color:var(--ink); }
    header { position:sticky; top:0; z-index:10; display:flex; align-items:center; gap:12px; padding:12px 20px; background:var(--ink); color:#fff; }
    header h1 { margin:0; font-size:18px; flex:1; }
    header button { font:inherit; font-size:13px; color:#fff; background:transparent; border:1px solid rgba(255,255,255,.4); border-radius:999px; padding:6px 14px; cursor:pointer; }
    .tabs { display:flex; gap:8px; padding:14px 20px 0; flex-wrap:wrap; }
    .tab { font:inherit; font-size:14px; padding:8px 16px; border-radius:999px; border:1px solid var(--line); background:var(--card); cursor:pointer; }
    .tab.active { background:var(--red); color:#fff; border-color:var(--red); }
    .badge { display:inline-block; min-width:20px; padding:0 6px; margin-left:6px; border-radius:999px; background:rgba(0,0,0,.15); font-size:12px; text-align:center; }
    main { padding:16px 20px 60px; display:grid; gap:14px; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); }
    .order { background:var(--card); border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,.08); border-top:6px solid var(--red); padding:14px 16px; display:grid; gap:10px; }
    .order.preparing { border-top-color:var(--amber); }
    .order.served { border-top-color:var(--green); opacity:.75; }
    .order.cancelled { border-top-color:var(--grey); opacity:.6; }
    .order-head { display:flex; justify-content:space-between; align-items:baseline; }
    .order-table { font-size:26px; font-weight:700; }
    .order-meta { font-size:12px; color:#6b7280; text-align:right; }
    .lines { margin:0; padding:0; list-style:none; display:grid; gap:4px; }
    .lines li { display:flex; justify-content:space-between; gap:10px; font-size:16px; }
    .lines b { color:var(--red); }
    .note { font-size:14px; padding:8px 10px; background:#fff6e0; border-radius:8px; }
    .total { text-align:right; font-weight:700; }
    .actions { display:flex; gap:8px; flex-wrap:wrap; }
    .actions button { flex:1; font:inherit; font-size:14px; font-weight:700; padding:10px; border:0; border-radius:8px; color:#fff; cursor:pointer; }
    .b-prep { background:var(--amber); } .b-serve { background:var(--green); } .b-cancel { background:var(--grey); }
    .empty { grid-column:1/-1; text-align:center; color:#6b7280; padding:48px 0; }
    #login { max-width:340px; margin:20vh auto; padding:24px; background:var(--card); border-radius:14px; box-shadow:0 2px 12px rgba(0,0,0,.1); display:grid; gap:12px; text-align:center; }
    #login input { font:inherit; font-size:16px; padding:12px; border:1.5px solid var(--line); border-radius:10px; }
    #login button, .sold-panel button.save { font:inherit; font-size:16px; font-weight:700; padding:12px; border:0; border-radius:10px; background:var(--red); color:#fff; cursor:pointer; }
    #login p { color:var(--red); margin:0; font-size:14px; }
    .sold-panel { margin:16px 20px 0; padding:14px 16px; background:var(--card); border-radius:12px; display:flex; flex-wrap:wrap; gap:10px; }
    .sold-panel label { display:flex; align-items:center; gap:6px; font-size:14px; padding:6px 10px; border:1px solid var(--line); border-radius:999px; cursor:pointer; }
    .sold-panel .title { width:100%; font-weight:700; font-size:14px; }
  </style>
</head>
<body>

<div id="login">
  <h2 style="margin:0">寿司 博多魚がし<br><small>注文管理</small></h2>
  <input id="pw" type="password" placeholder="パスワード" autocomplete="current-password">
  <button id="btn-login" type="button">ログイン</button>
  <p id="login-err" hidden>パスワードが違います</p>
</div>

<div id="app" hidden>
  <header>
    <h1>注文管理</h1>
    <button id="btn-sound" type="button">🔔 通知音: ON</button>
    <button id="btn-logout" type="button">ログアウト</button>
  </header>
  <div class="tabs" id="tabs"></div>
  <details class="sold-panel" id="sold-details" style="display:block">
    <summary style="cursor:pointer;font-weight:700">売り切れ設定</summary>
    <div id="sold-list" style="display:flex;flex-wrap:wrap;gap:10px;margin-top:10px"></div>
  </details>
  <main id="orders"></main>
</div>

<script>
(function () {
  "use strict";
  const $ = (s) => document.querySelector(s);
  const LABELS = { active: "対応中", served: "提供済み", cancelled: "キャンセル", all: "すべて" };
  let password = sessionStorage.getItem("adminPw") || "";
  let filter = "active";
  let orders = [];
  let knownIds = null;
  let soundOn = true;
  let timer = null;

  async function api(path, opts = {}) {
    const res = await fetch(path, {
      ...opts,
      headers: { "Content-Type": "application/json", "x-admin-password": password, ...(opts.headers || {}) },
    });
    if (res.status === 401) throw new Error("unauthorized");
    return res.json();
  }

  function beep() {
    if (!soundOn) return;
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value = 880; g.gain.value = 0.15;
      o.start(); o.stop(ctx.currentTime + 0.25);
    } catch { /* audio blocked until first interaction */ }
  }

  function yen(n) { return "¥" + n.toLocaleString("ja-JP"); }
  function timeOf(iso) { return new Date(iso).toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit" }); }

  function isActive(o) { return o.status === "new" || o.status === "preparing"; }
  function visible() {
    if (filter === "all") return orders;
    if (filter === "active") return orders.filter(isActive);
    return orders.filter((o) => o.status === filter);
  }

  function renderTabs() {
    const tabs = $("#tabs");
    tabs.textContent = "";
    Object.keys(LABELS).forEach((key) => {
      const b = document.createElement("button");
      b.className = "tab" + (key === filter ? " active" : "");
      b.type = "button";
      b.textContent = LABELS[key];
      if (key === "active") {
        const n = document.createElement("span");
        n.className = "badge";
        n.textContent = orders.filter(isActive).length;
        b.appendChild(n);
      }
      b.addEventListener("click", () => { filter = key; renderTabs(); renderOrders(); });
      tabs.appendChild(b);
    });
  }

  function actionButton(cls, text, status, id) {
    const b = document.createElement("button");
    b.type = "button"; b.className = cls; b.textContent = text;
    b.addEventListener("click", async () => {
      await api("/api/admin/orders/" + id, { method: "PATCH", body: JSON.stringify({ status }) });
      refresh();
    });
    return b;
  }

  function renderOrders() {
    const box = $("#orders");
    box.textContent = "";
    const list = visible();
    if (list.length === 0) {
      const p = document.createElement("p");
      p.className = "empty"; p.textContent = "注文はありません";
      box.appendChild(p);
      return;
    }
    list.forEach((o) => {
      const card = document.createElement("article");
      card.className = "order " + o.status;

      const head = document.createElement("div");
      head.className = "order-head";
      const tbl = document.createElement("div");
      tbl.className = "order-table";
      tbl.textContent = "テーブル " + o.table;
      const meta = document.createElement("div");
      meta.className = "order-meta";
      meta.textContent = "#" + o.id + " ・ " + timeOf(o.createdAt) + " ・ " + o.lang;
      head.append(tbl, meta);

      const ul = document.createElement("ul");
      ul.className = "lines";
      o.lines.forEach((l) => {
        const li = document.createElement("li");
        const n = document.createElement("span"); n.textContent = l.name;
        const q = document.createElement("b"); q.textContent = "× " + l.qty;
        li.append(n, q);
        ul.appendChild(li);
      });

      card.append(head, ul);

      if (o.note) {
        const note = document.createElement("div");
        note.className = "note"; note.textContent = "📝 " + o.note;
        card.appendChild(note);
      }

      const total = document.createElement("div");
      total.className = "total"; total.textContent = yen(o.total);
      card.appendChild(total);

      const actions = document.createElement("div");
      actions.className = "actions";
      if (o.status === "new") actions.appendChild(actionButton("b-prep", "調理開始", "preparing", o.id));
      if (o.status === "new" || o.status === "preparing") {
        actions.appendChild(actionButton("b-serve", "提供済み", "served", o.id));
        actions.appendChild(actionButton("b-cancel", "取消", "cancelled", o.id));
      }
      if (actions.children.length) card.appendChild(actions);
      box.appendChild(card);
    });
  }

  async function renderSoldOut() {
    const items = await api("/api/admin/menu");
    const box = $("#sold-list");
    box.textContent = "";
    items.forEach((i) => {
      const label = document.createElement("label");
      const cb = document.createElement("input");
      cb.type = "checkbox"; cb.checked = i.soldOut;
      cb.addEventListener("change", () =>
        api("/api/admin/menu/" + i.id + "/soldout", { method: "PATCH", body: JSON.stringify({ soldOut: cb.checked }) }));
      label.append(cb, document.createTextNode(i.name));
      box.appendChild(label);
    });
  }

  async function refresh() {
    try {
      orders = await api("/api/admin/orders");
    } catch {
      logout();
      return;
    }
    const ids = new Set(orders.map((o) => o.id));
    if (knownIds && [...ids].some((id) => !knownIds.has(id))) beep();
    knownIds = ids;
    renderTabs();
    renderOrders();
  }

  async function start() {
    $("#login").hidden = true;
    $("#app").hidden = false;
    await refresh();
    renderSoldOut();
    timer = setInterval(refresh, 5000);
  }

  function logout() {
    clearInterval(timer);
    sessionStorage.removeItem("adminPw");
    password = "";
    knownIds = null;
    $("#app").hidden = true;
    $("#login").hidden = false;
  }

  async function login() {
    password = $("#pw").value;
    try {
      await api("/api/admin/orders");
      sessionStorage.setItem("adminPw", password);
      $("#login-err").hidden = true;
      start();
    } catch {
      $("#login-err").hidden = false;
    }
  }

  $("#btn-login").addEventListener("click", login);
  $("#pw").addEventListener("keydown", (e) => { if (e.key === "Enter") login(); });
  $("#btn-logout").addEventListener("click", logout);
  $("#btn-sound").addEventListener("click", () => {
    soundOn = !soundOn;
    $("#btn-sound").textContent = "🔔 通知音: " + (soundOn ? "ON" : "OFF");
  });

  if (password) start();
})();
</script>
</body>
</html>
